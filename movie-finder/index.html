<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Finder</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Movies Finder</h1>
        <input type="text" id="inputMovies" placeholder="Search Movies">
        <button id="searchBtn">Search</button>
        <div class="hidden" id="movieDetails">
            <img src="" alt="" id="moviePoster">
            <p id="movieName">Name: </p>
            <p id="movieOverview">Overview: </p>
            <p id="movieDirector">Director: </p>
            <p id="movieRuntime">Runtime: </p>
            <p id="movieGenre">Genre: </p>
            <p id="movieRating">Rating: </p>
            <p id="movieYear">Release Year: </p>
            <p id="movieCast">Cast: </p>
            <p id="movieAwards">Awards: </p>
        </div>
        <p id="errorMsg" class="hidden" >No Movies Found. Try Again.</p>
    </div>
    <script src="./script.js"></script>
</body>
</html>
